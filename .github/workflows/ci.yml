name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    name: local smoke (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: node --check o2p-platform.mjs && node --check test-v3-local.mjs
      - name: run smoke suite (22 checks, no network needed)
        run: node test-v3-local.mjs
