map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # aliyun.jiangjiangze.icu        -> apex: /api/* + /healthz + landing
    # <roomId>.jiangjiangze.icu      -> room web entry (proxied to the room's openp2p forward)
    listen 127.0.0.1:8080;
    server_name aliyun.jiangjiangze.icu p2p.jiangjiangze.icu "~^[a-z0-9]{4,32}\.jiangjiangze\.icu$";

    client_max_body_size 16m;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
